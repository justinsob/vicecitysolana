<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fumble card · $VICECITY Hall of Fumblers</title>
<meta name="description" content="Make a FUMBLED card for any big $VICECITY sell. Public on-chain trades, valued at the live price.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Mr+Dafoe&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff3ea5;--cyan:#2ee6e6;--line:#2c1c4d;--text:#f3ecff;--mute:#a99cc7}
*{box-sizing:border-box}
body{margin:0;background:#0a0516;color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:"Mr Dafoe",cursive;font-size:30px;color:var(--pink);text-shadow:0 0 14px rgba(255,62,165,.7);text-decoration:none}
a{color:var(--cyan)}
canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#000}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{display:inline-flex;align-items:center;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:#150b2b;color:var(--text);font:700 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#12051f}
input{flex:1;min-width:180px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#150b2b;color:var(--text);font:500 14px "JetBrains Mono",monospace}
.note{color:var(--mute);font-size:13px;line-height:1.5;margin-top:14px}
body.bare{background:#000}
body.bare main{max-width:none;padding:0;margin:0}
body.bare .ui{display:none}
body.bare canvas{width:1200px;height:auto;max-width:none!important;border:0;border-radius:0}
</style>
</head>
<body>
<main>
  <div class="top ui">
    <a class="brand" href="/">Vice City</a>
    <a href="/#fumblers">← Back to the Hall of Fumblers</a>
  </div>
  <canvas id="c" width="1200" height="675" aria-label="Fumble card"></canvas>
  <div class="row ui">
    <button class="btn primary" id="dl">Download image</button>
    <button class="btn" id="cp">Copy image</button>
    <a class="btn" id="tw" target="_blank" rel="noopener">Post on X</a>
    <button class="btn" id="joke">New joke</button>
    <button class="btn" id="shape">Make it square</button>
  </div>
  <div class="row ui">
    <input id="name" maxlength="24" placeholder="Name on the card (optional, replaces the wallet)">
  </div>
  <p class="note ui" id="note">Loading the trade…</p>
</main>
<script>
const POOL = "7xLmwsPbCSMVvfFQ9JuhMwfbkehJA3mswshVBBWcJ1j2";
const FUM_LIVE = "https://vicecity-alerts.justin-35e.workers.dev/fumblers.json";
const q = new URLSearchParams(location.search);
if (q.get("bare")) document.body.classList.add("bare");
const $ = id => document.getElementById(id);
const short = a => a.slice(0, 4) + "…" + a.slice(-4);
const money = n => "$" + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: Math.abs(n) < 100 ? 2 : 0 });
const num = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : (+n).toFixed(0);

const JOKES = [
  "Sold the dip. Kept the regret.",
  "Paper hands. Diamond regrets.",
  "Took profits. Left the profits.",
  "Left the party right before the music started.",
  "Wanted lunch money. Skipped the feast.",
  "Certified paper hands. Notarized on-chain.",
  "The exit was early. The pain is right on time.",
  "Sold for gas money. The car left without them.",
  "Checked out of Vice City one night too soon.",
  "Hit sell. The chart took it personally.",
  "Technically a profit. Spiritually a disaster.",
  "The beach was nice. The view from the sidelines, less so."
];
const WATCH = [
  "On the watchlist. One green candle from a fumble.",
  "Sold. The chart has been informed.",
  "Clock's ticking. Vice City remembers.",
  "Out for now. The Hall of Fumblers keeps a seat warm.",
  "Cashed out. We'll check back at the next pump."
];

let square = q.get("size") === "square";
let sell = null, price = 0, jokeN = 0, bg = null;
const hash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };

function fit(ctx, text, maxW, size, font) { // shrink the type until the line fits
  do { ctx.font = font(size); if (ctx.measureText(text).width <= maxW) break; size -= 2; } while (size > 12);
  return size;
}

function draw() {
  const c = $("c"), W = 1200, H = square ? 1200 : 675;
  if (c.height !== H) c.height = H;
  const ctx = c.getContext("2d");
  // layout: B is the top of the band, bh its height, k scales the type under it
  const B = square ? 345 : 150, bh = square ? 270 : 230, mid = B + bh / 2, k = square ? 1.18 : 1;
  const y1 = square ? B + bh + 92 : 440, y2 = square ? y1 + 108 : 526, y3 = square ? y2 + 48 : 562, y4 = square ? y3 + 70 : 610;
  ctx.clearRect(0, 0, W, H);
  // street photo, drained of colour like the end of a bad mission
  if (bg) {
    const s = Math.max(W / bg.width, H / bg.height), w = bg.width * s, h = bg.height * s;
    ctx.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h);
    ctx.globalCompositeOperation = "saturation"; ctx.fillStyle = "#808080"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  } else { ctx.fillStyle = "#1a1a1e"; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "rgba(8,6,12,.5)"; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, square ? 980 : 760);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.8)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (!sell) return;

  const now = sell.tokens * price, fum = now - sell.usd, mult = now / sell.usd;
  const fumbled = fum >= Math.max(25, sell.usd * 0.1);
  const who = ($("name").value.trim() || short(sell.wallet));

  // header
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.font = '58px "Mr Dafoe"'; ctx.fillStyle = "#ff5cb4"; ctx.shadowColor = "rgba(255,62,165,.8)"; ctx.shadowBlur = 18;
  ctx.fillText("Vice City", 48, 84); ctx.shadowBlur = 0;
  ctx.textAlign = "right"; ctx.font = '700 20px "JetBrains Mono"'; ctx.fillStyle = "#2ee6e6";
  ctx.fillText("HALL OF FUMBLERS", W - 48, 62);
  ctx.font = '500 16px "JetBrains Mono"'; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText(new Date(sell.ts).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }), W - 48, 88);

  // the band
  ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(0, B, W, bh);
  ctx.fillStyle = "#ff2a22"; ctx.fillRect(0, B, W, 4); ctx.fillRect(0, B + bh - 4, W, 4);
  ctx.textAlign = "center";
  const word = fumbled ? "FUMBLED" : "PAPER HANDS";
  const ws = fit(ctx, word, W - 160, square ? 250 : 210, s => `${s}px Anton`);
  ctx.lineJoin = "round"; ctx.lineWidth = 14; ctx.strokeStyle = "#0b0b0c"; 
  const wm = ctx.measureText(word), wy = mid + (wm.actualBoundingBoxAscent - wm.actualBoundingBoxDescent) / 2; // exact vertical centre of the band
  ctx.strokeText(word, W / 2, wy);
  ctx.fillStyle = "#ff2a22"; ctx.shadowColor = "rgba(255,42,34,.55)"; ctx.shadowBlur = 30; ctx.fillText(word, W / 2, wy); ctx.shadowBlur = 0;

  // who and what
  const line = `${who} sold ${num(sell.tokens)} $VICECITY for ${money(sell.usd)}`;
  fit(ctx, line, W - 120, 36 * k, s => `700 ${s}px "JetBrains Mono"`);
  ctx.fillStyle = "#fff"; ctx.fillText(line, W / 2, y1);

  const bigLine = fumbled ? `+${money(fum)} LEFT ON THE TABLE` : `THAT BAG IS ${money(now)} NOW`;
  fit(ctx, bigLine, W - 120, 78 * k, s => `${s}px Anton`);
  ctx.fillStyle = "#ffd166"; ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 12; ctx.fillText(bigLine, W / 2, y2); ctx.shadowBlur = 0;

  const sub = fumbled ? `That bag is worth ${money(now)} today${mult >= 2 ? ` · ${mult >= 10 ? mult.toFixed(0) : mult.toFixed(1)}x what they took` : ""}` : "Not a fumble yet. The chart decides.";
  ctx.font = `500 ${Math.round(20 * k)}px "JetBrains Mono"`; ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillText(sub, W / 2, y3);

  const list = fumbled ? JOKES : WATCH, joke = list[(hash(sell.tx) + jokeN) % list.length];
  fit(ctx, "“" + joke + "”", W - 160, 28 * k, s => `italic 600 ${s}px Inter`);
  ctx.fillStyle = "#ff8ac6"; ctx.fillText("“" + joke + "”", W / 2, y4);

  // footer
  ctx.font = '700 18px "JetBrains Mono"'; ctx.textAlign = "left"; ctx.fillStyle = "#2ee6e6"; ctx.fillText("vicecitysolana.cc", 48, H - 26);
  ctx.textAlign = "right"; ctx.font = '500 14px "JetBrains Mono"'; ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.fillText("Trades, not people. Public on-chain data, valued at the live price.", W - 48, H - 26);
}

async function getList() {
  for (const url of [FUM_LIVE, "fumblers.json"]) {
    try { const j = await (await fetch(url, { cache: "no-store" })).json(); if (j && j.sells && j.sells.length) return j.sells; } catch {}
  }
  return [];
}

(async () => {
  const img = new Image(); img.src = "media/walk-poster.jpg";
  const [sells, pair] = await Promise.all([
    getList(),
    fetch("https://api.dexscreener.com/latest/dex/pairs/solana/" + POOL).then(r => r.json()).then(j => j.pair).catch(() => null),
    img.decode().then(() => { bg = img; }).catch(() => {}),
    document.fonts.load("200px Anton"), document.fonts.load('58px "Mr Dafoe"'), document.fonts.load('700 30px "JetBrains Mono"'),
    document.fonts.load('500 20px "JetBrains Mono"'), document.fonts.load("italic 600 28px Inter")
  ]);
  price = pair ? +pair.priceUsd : 0;
  const tx = q.get("tx") || "";
  sell = tx ? sells.find(s => s.tx === tx) || sells.find(s => s.tx.startsWith(tx)) : null;
  if (!sell && !tx && price) sell = [...sells].sort((a, b) => b.tokens * price - b.usd - (a.tokens * price - a.usd))[0]; // no trade named: the biggest fumble
  if (q.get("name")) $("name").value = q.get("name").slice(0, 24);
  if (!sell || !price) { draw(); $("note").textContent = !price ? "Couldn't load the live price. Refresh to try again." : "That trade isn't on the list. Only sells of $100 or more are tracked."; return; }
  draw(); document.body.dataset.ready = "1";
  $("note").innerHTML = "";
  const a = document.createElement("a"); a.href = "https://solscan.io/tx/" + sell.tx; a.target = "_blank"; a.rel = "noopener"; a.textContent = "View the transaction";
  $("note").append("The numbers come from a public on-chain trade and the live $VICECITY price when you opened this page. It shows what the sold tokens are worth now, not anyone's profit or loss. ", a, ".");
  $("tw").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent("Another one for the $VICECITY Hall of Fumblers 🫠") + "&url=" + encodeURIComponent("https://vicecitysolana.cc/card.html?tx=" + sell.tx);
})();

$("name").addEventListener("input", draw);
const shapeLabel = () => { $("shape").textContent = square ? "Make it wide" : "Make it square"; $("c").style.maxWidth = square ? "640px" : ""; };
$("shape").onclick = () => { square = !square; shapeLabel(); draw(); };
shapeLabel();
$("joke").onclick = () => { jokeN++; draw(); };
$("dl").onclick = () => $("c").toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "fumbled-" + (sell ? sell.wallet.slice(0, 6) : "card") + (square ? "-square" : "") + ".png"; a.click(); });
$("cp").onclick = async () => {
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": new Promise(r => $("c").toBlob(r)) })]); $("cp").textContent = "Copied"; }
  catch { $("cp").textContent = "Use Download"; }
  setTimeout(() => { $("cp").textContent = "Copy image"; }, 1600);
};
</script>
</body>
</html>
